<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="0.6" stop-color="#fff0dc"/>
      <stop offset="1" stop-color="#f9dcbd"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#c41f9f"/>
      <stop offset="1" stop-color="#8b2fe8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
  </defs>
  <!-- extruded depth behind the card face -->
  <path d="M30 26 L594 14 L578 128 L10 136 Z" fill="url(#depth)" stroke="#2a0f2e" stroke-width="4" stroke-linejoin="round"/>
  <!-- card face -->
  <path d="M38 12 L586 4 L570 112 L18 122 Z" fill="url(#face)"/>
  <!-- left magenta slash -->
  <path d="M38 12 L62 11.6 L42.5 121.6 L18 122 Z" fill="#ff2bd6"/>
  <!-- right sunset slash -->
  <path d="M548 4.6 L586 4 L570 112 L532 112.7 Z" fill="url(#spark)"/>
  <!-- soft top highlight -->
  <path d="M64 15 L546 8 L544 20 L62 27 Z" fill="#ffffff" opacity="0.55"/>
  <!-- face outline -->
  <path d="M38 12 L586 4 L570 112 L18 122 Z" fill="none" stroke="#2a0f2e" stroke-width="4" stroke-linejoin="round"/>
</svg>
